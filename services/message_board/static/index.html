<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self';
  img-src 'self' blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline';
  base-uri 'none'; form-action 'none'">
<title>Message Board</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #5f6877; --border: #dde1e8;
  --accent: #2f5fd0; --ok: #1d7a45; --warn: #a15c00; --bad: #b42318; --chip: #eef1f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #12151b; --card: #1b1f27; --text: #e4e7ee; --muted: #9aa3b2; --border: #2c323d;
    --accent: #8fb0ff; --ok: #5fd08e; --warn: #f0b45a; --bad: #ff8a80; --chip: #252b35;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
h1 { font-size: 20px; margin: 0; }
#status { color: var(--muted); font-size: 13px; }
#status[data-state="ok"]::before { content: "\25CF "; color: var(--ok); }
#status[data-state="warn"]::before { content: "\25CF "; color: var(--warn); }
#status[data-state="bad"]::before { content: "\25CF "; color: var(--bad); }
#auth { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0;
  padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
#auth input { flex: 1 1 180px; min-width: 0; padding: 6px 8px; font: inherit; }
#identity, #composer { margin: 12px 0; }
#identity-form, #composer { padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
#identity-form[hidden], #mentions[hidden], #auth[hidden], #lightbox[hidden], #admin[hidden],
#admin-body[hidden] { display: none; }
#identity-form, #composer-tools, #file-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
#identity-form input { flex: 1 1 180px; min-width: 0; padding: 6px 8px; font: inherit; }
#composer textarea { display: block; width: 100%; min-height: 72px; resize: vertical; padding: 8px; font: inherit; }
#composer-tools { justify-content: space-between; margin-top: 8px; }
#composer-error { min-height: 1em; margin: 6px 0 0; }
.chip { background: var(--chip); border-radius: 12px; padding: 2px 8px; }
#mentions { position: absolute; z-index: 2; background: var(--card); border: 1px solid var(--border); border-radius: 6px; }
#mentions button { display: block; width: 100%; border: 0; text-align: left; } #mentions button[data-active="1"] { background: var(--chip); }
body.dragging main { outline: 2px dashed var(--accent); outline-offset: -4px; }
button { font: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--chip); color: var(--text); }
button:disabled { opacity: .6; cursor: progress; }
#posts { list-style: none; margin: 12px 0 0; padding: 0; }
.post { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 10px; overflow-wrap: anywhere; }
.head { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.author { font-weight: 600; color: var(--text); }
.meme { background: var(--chip); border-radius: 10px; padding: 0 8px; }
.mentions { font-size: 13px; color: var(--accent); margin-top: 2px; }
.text { margin: 6px 0 0; white-space: pre-wrap; }
.atts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
figure { margin: 0; max-width: 100%; }
figure img { display: block; max-width: min(240px, 100%); max-height: 240px;
  border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
figcaption, .err { font-size: 12px; color: var(--muted); }
.err { color: var(--bad); }
.empty { color: var(--muted); }
body[data-live="0"] #posts { opacity: .45; pointer-events: none; filter: grayscale(.6); }
.file-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
pre.preview { flex-basis: 100%; max-height: 320px; overflow: auto; margin: 4px 0 0; padding: 8px;
  background: var(--chip); border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
#lightbox { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; padding: 16px; background: rgba(0, 0, 0, .82); }
#lightbox img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; }
#lightbox .bar { display: flex; gap: 8px; align-items: center; color: #e4e7ee; }
#admin { margin: 12px 0; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
#admin-body { margin-top: 10px; }
.admin-bar, .admin-member { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
#admin-members { list-style: none; margin: 10px 0 0; padding: 0; }
.admin-member { padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.admin-member .who { flex: 1 1 180px; overflow-wrap: anywhere; }
.admin-member .meta { color: var(--muted); }
.banned { color: var(--bad); font-weight: 600; }
button.danger { color: var(--bad); border-color: var(--bad); }
#admin-error { min-height: 1em; margin: 6px 0 0; }
</style>
</head>
<body data-live="0">
<main>
  <div class="top">
    <h1>Message board</h1>
    <span id="status" data-state="warn" role="status" aria-live="polite">connecting…</span>
  </div>
  <section id="admin" hidden aria-label="Board admin">
    <div class="admin-bar"><button type="button" id="admin-toggle" aria-expanded="false" aria-controls="admin-body">Admin ▸</button></div>
    <div id="admin-body" hidden>
      <div class="admin-bar">
        <button type="button" id="admin-clear" class="danger">Clear history</button>
        <button type="button" id="admin-shutdown" class="danger">Shut down board</button>
      </div>
      <ul id="admin-members"></ul>
    </div>
    <p id="admin-error" class="err" role="status" aria-live="polite"></p>
  </section>
  <form id="auth" hidden>
    <label for="token">This board needs a token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button type="submit">Connect</button>
  </form>
  <div id="identity"></div>
  <form id="identity-form" hidden>
    <label for="identity-name">Your name</label>
    <input id="identity-name" autocomplete="nickname" maxlength="64">
    <button type="submit">Set name</button>
    <button type="button" id="identity-cancel">Cancel</button>
    <span id="identity-error" class="err"></span>
  </form>
  <form id="composer">
    <div id="reply-label" hidden></div>
    <textarea id="compose-text" aria-label="Post text"></textarea>
    <div id="mentions" hidden role="listbox"></div>
    <div id="file-chips"></div>
    <div id="composer-tools">
      <span><button type="button" id="attach">Attach</button><input id="file-input" type="file" multiple hidden></span>
      <span id="counter">0/700</span>
      <button type="submit" id="send" disabled>Send</button>
    </div>
    <p id="composer-error" class="err" role="status" aria-live="polite"></p>
  </form>
  <p id="empty" class="empty">No posts yet.</p>
  <ol id="posts"></ol>
</main>
<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image">
  <img id="lightbox-img" alt="">
  <div class="bar">
    <span id="lightbox-name"></span>
    <button type="button" id="lightbox-save">Download</button>
    <button type="button" id="lightbox-close">Close</button>
  </div>
</div>
<script>
"use strict";
// Viewer and composer. Posts are untrusted: they are rendered only via textContent and
// createElement, and only blob URLs created here are ever assigned to src or href.
const ATT_ID = /^att_[0-9a-f]{12}$/;
const MAX_POSTS = 200;
const BACKOFF = [1, 2, 4, 8, 16, 30];
const STALL_MS = 45000;
const HEADERS_MS = 15000;
const TOKEN_KEY = "dagiBoardToken";
const USER_KEY = "dagiBoardUser";
const ADMIN_KEY = "dagiBoardAdmin";
const MAX_FILES = 4;
const PRESENCE_MS = 30000;
const MAX_FILE = 10 * 1024 * 1024;
const PREVIEW_MAX = 256 * 1024;
const listEl = document.getElementById("posts");
const statusEl = document.getElementById("status");
const emptyEl = document.getElementById("empty");
const authForm = document.getElementById("auth");
const tokenInput = document.getElementById("token");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxName = document.getElementById("lightbox-name");
const identityEl = document.getElementById("identity");
const identityForm = document.getElementById("identity-form");
const identityName = document.getElementById("identity-name");
const identityError = document.getElementById("identity-error");
const composeForm = document.getElementById("composer");
const composeText = document.getElementById("compose-text");
const counterEl = document.getElementById("counter");
const sendButton = document.getElementById("send");
const composerError = document.getElementById("composer-error");
const fileInput = document.getElementById("file-input");
const fileChips = document.getElementById("file-chips");
const replyLabel = document.getElementById("reply-label");
const mentionsEl = document.getElementById("mentions");
const adminEl = document.getElementById("admin");
const adminError = document.getElementById("admin-error");
const adminMembers = document.getElementById("admin-members");
const adminClear = document.getElementById("admin-clear");
const adminShutdown = document.getElementById("admin-shutdown");
const adminToggle = document.getElementById("admin-toggle");
const adminBody = document.getElementById("admin-body");
const state = {last: 0, seen: new Set(), loaded: false, retry: 0, timer: null,
               ctrl: null, connected: false, memToken: "", memUser: null, members: [],
               membersLoaded: false, membersLoading: false, membersRefreshQueued: false,
               refreshedAuthors: new Set(), pendingAuthors: new Set(), registeredHandle: "",
               files: [], replyTo: null, sending: false, identitySubmitting: false,
               mentionIndex: -1, identityForSend: false, memAdmin: "", adminOk: false,
               adminChecking: false, adminBusy: false, adminPurge: new Set(), stopped: false, adminOpen: false};

class ApiError extends Error {
  constructor(status, code, message) { super(message || ("HTTP " + status)); this.status = status; this.code = code; }
}

function getToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || state.memToken; }
  catch (err) { return state.memToken; }
}

function saveToken(value) {
  state.memToken = value;
  try { sessionStorage.setItem(TOKEN_KEY, value); } catch (err) { /* memory only */ }
}

function getAdminKey() {
  try { return sessionStorage.getItem(ADMIN_KEY) || state.memAdmin; }
  catch (err) { return state.memAdmin; }
}

function saveAdminKey(value) {
  state.memAdmin = value;
  try { if (value) sessionStorage.setItem(ADMIN_KEY, value); else sessionStorage.removeItem(ADMIN_KEY); }
  catch (err) { /* memory only */ }
}

// The launcher opens the page with #admin=<key>; the fragment never reaches the server and is
// dropped from the address bar at once, so the key lives only in this tab's session storage.
function takeAdminKey() {
  let hash = "";
  try { hash = String(location.hash || ""); } catch (err) { return; }
  if (!hash.startsWith("#admin=")) return;
  const match = /^#admin=([A-Za-z0-9_-]{32,128})$/.exec(hash);
  if (match) saveAdminKey(match[1]);
  try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* keep going */ }
}

async function api(path, signal, init = {}) {
  const headers = {};
  const token = getToken();
  if (token) headers.Authorization = "Bearer " + token;
  const response = await fetch(path, {...init, headers: {...headers, ...(init.headers || {})}, signal,
    cache: "no-store"});
  if (!response.ok) {
    let data = {};
    try { data = await response.clone().json(); } catch (err) { /* non-JSON error response */ }
    throw new ApiError(response.status, data.code || "HTTP_ERROR", data.error || ("HTTP " + response.status));
  }
  return response;
}

function handleApiError(err) { if (err instanceof ApiError && err.status === 401) askToken(); }

// Any state but "ok" means the board is unreachable or locked: the page goes dead (dimmed and
// inert) until the stream reconnects, then catches up from the last post id it saw.
function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.dataset.state = kind;
  document.body.dataset.live = kind === "ok" ? "1" : "0";
  if (kind !== "ok") closeLightbox();
  updateComposer();
}

function make(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function humanSize(size) {
  const n = Number(size);
  if (!Number.isFinite(n) || n < 0) return "? B";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}

function localTime(value) {
  const date = new Date(String(value));
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString([], {dateStyle: "medium", timeStyle: "short"});
}

async function loadBlob(id, signal) {
  if (!ATT_ID.test(id)) throw new Error("invalid attachment id");
  return (await api("/attachments/" + id, signal)).blob();
}

function saveBlobUrl(url, name) {
  const link = make("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();
}

function openLightbox(url, name) {
  lightboxImg.src = url;
  lightboxImg.alt = name;
  lightboxName.textContent = name;
  lightbox.dataset.name = name;
  lightbox.hidden = false;
  document.getElementById("lightbox-close").focus();
}

function closeLightbox() {
  if (lightbox.hidden) return;
  lightbox.hidden = true;
  lightboxImg.removeAttribute("src");
}

function renderImage(att, label, post) {
  const figure = make("figure");
  const img = make("img");
  const name = String(att.name || att.id);
  img.alt = name;
  img.decoding = "async";
  img.title = "Open full size";
  figure.append(img, make("figcaption", null, label));
  loadBlob(att.id).then((blob) => {
    const url = URL.createObjectURL(blob);
    if (!post.isConnected) { URL.revokeObjectURL(url); return; }
    post.blobUrls.push(url);
    img.src = url;
    img.addEventListener("click", () => openLightbox(url, name));
  }).catch((err) => {
    img.remove();
    figure.append(make("span", "err", err instanceof ApiError && err.status === 401 ? "token required"
                                                                : "image unavailable"));
    handleApiError(err);
  });
  return figure;
}

async function download(id, name, button) {
  button.disabled = true;
  try {
    const blob = await loadBlob(id);
    const url = URL.createObjectURL(new Blob([blob], {type: "application/octet-stream"}));
    saveBlobUrl(url, name);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    button.title = "";
  } catch (err) {
    button.title = err instanceof ApiError && err.status === 401 ? "token required" : "download failed";
    handleApiError(err);
  } finally {
    button.disabled = false;
  }
}

function renderAttachment(att, post) {
  if (!att || typeof att.id !== "string" || !ATT_ID.test(att.id)) {
    return make("span", "err", "invalid attachment");
  }
  const name = String(att.name || att.id);
  const label = name + " (" + humanSize(att.size) + ")";
  if (att.kind === "image") return renderImage(att, label, post);
  const row = make("div", "file-row");
  const button = make("button", "file", "\u{1F4CE} " + label);
  button.type = "button";
  button.addEventListener("click", () => download(att.id, name, button));
  row.append(button);
  const size = Number(att.size);
  if (Number.isFinite(size) && size > 0 && size <= PREVIEW_MAX) {
    const toggle = make("button", "preview-toggle", "Preview");
    toggle.type = "button";
    toggle.addEventListener("click", () => togglePreview(att.id, row, toggle));
    row.append(toggle);
  }
  return row;
}

// Show a small attachment as text when it is valid UTF-8 without NUL bytes.
async function togglePreview(id, row, toggle) {
  const shown = row.querySelector("pre.preview, .preview-err");
  if (shown) { shown.remove(); toggle.textContent = "Preview"; return; }
  toggle.disabled = true;
  try {
    const blob = await loadBlob(id);
    if (blob.size > PREVIEW_MAX) throw new RangeError("too large");
    const text = new TextDecoder("utf-8", {fatal: true}).decode(await blob.arrayBuffer());
    if (text.includes("\u0000")) throw new TypeError("binary");
    row.append(make("pre", "preview", text));
    toggle.textContent = "Hide";
  } catch (err) {
    handleApiError(err);
    const reason = err instanceof ApiError && err.status === 401 ? "token required"
      : err instanceof TypeError ? "not a text file" : "preview unavailable";
    row.append(make("span", "err preview-err", reason));
  } finally {
    toggle.disabled = false;
  }
}

function renderPost(p) {
  const post = make("li", "post");
  post.dataset.id = String(p.id);
  post.dataset.author = String(p.author);
  post.blobUrls = [];
  const head = make("div", "head");
  const time = make("time", null, localTime(p.created_at));
  time.title = String(p.created_at);
  head.append(make("span", "author", p.author), time, make("span", null, "#" + p.id));
  if (Number.isInteger(p.reply_to)) head.append(make("span", null, "↩ #" + p.reply_to));
  if (typeof p.meme === "string" && p.meme) head.append(make("span", "meme", p.meme));
  post.append(head);
  if (Array.isArray(p.mentions) && p.mentions.length) {
    post.append(make("div", "mentions", p.mentions.map((m) => "@" + m).join(" ")));
  }
  post.append(make("p", "text", p.text));
  const reply = make("button", "reply", "Reply");
  reply.type = "button";
  reply.disabled = state.sending || state.identitySubmitting;
  reply.addEventListener("click", () => setReply(p.id, p.author));
  post.append(reply);
  if (Array.isArray(p.attachments) && p.attachments.length) {
    const box = make("div", "atts");
    for (const att of p.attachments) box.append(renderAttachment(att, post));
    post.append(box);
  }
  return post;
}

function trimPost(node) {
  for (const url of node.blobUrls || []) URL.revokeObjectURL(url);
  state.seen.delete(Number(node.dataset.id));
  node.remove();
}

function addPost(p) {
  if (!p || typeof p !== "object" || !Number.isInteger(p.id) || p.id < 1) return;
  if (state.seen.has(p.id)) return;
  const oldest = listEl.lastElementChild;
  if (listEl.children.length >= MAX_POSTS && oldest && p.id < Number(oldest.dataset.id)) return;
  state.seen.add(p.id);
  state.last = Math.max(state.last, p.id);
  const node = renderPost(p);
  if (p.author && !state.members.some((member) => member.handle === p.author)) {
    state.pendingAuthors.add(p.author);
    if (state.membersLoading && !state.refreshedAuthors.has(p.author)) {
      state.refreshedAuthors.add(p.author); state.membersRefreshQueued = true;
    } else if (state.membersLoaded && !state.refreshedAuthors.has(p.author)) {
      state.refreshedAuthors.add(p.author); state.membersLoaded = false; loadMembers();
    }
  }
  let before = listEl.firstElementChild;
  while (before && Number(before.dataset.id) > p.id) {
    before = before.nextElementSibling;
  }
  listEl.insertBefore(node, before);
  while (listEl.children.length > MAX_POSTS) trimPost(listEl.lastElementChild);
  emptyEl.hidden = listEl.children.length > 0;
}

function handleBlock(block) {
  let event = "message";
  const data = [];
  for (const line of block.split("\n")) {
    if (!line || line[0] === ":") continue;  // comments such as ": ping"
    const colon = line.indexOf(":");
    const field = colon < 0 ? line : line.slice(0, colon);
    let value = colon < 0 ? "" : line.slice(colon + 1);
    if (value[0] === " ") value = value.slice(1);
    if (field === "event") event = value;
    else if (field === "data") data.push(value);
  }
  if ((event !== "post" && event !== "purge") || !data.length) return;
  let payload;
  try { payload = JSON.parse(data.join("\n")); } catch (err) { return; }
  if (event === "purge") removePurged(payload); else addPost(payload);
}

// Purges are replayed on every connect, so removing already-gone posts must be a no-op.
function removePurged(purge) {
  if (!purge || typeof purge !== "object" || !Number.isInteger(purge.through)) return;
  if (purge.scope !== "all" && !(purge.scope === "author" && typeof purge.author === "string")) return;
  for (const node of Array.from(listEl.children)) {
    if (Number(node.dataset.id) <= purge.through
        && (purge.scope === "all" || node.dataset.author === purge.author)) trimPost(node);
  }
  emptyEl.hidden = listEl.children.length > 0;
}

// Abort (and count as a failure, not a cancel) when response headers take too long.
async function withDeadline(ctrl, work) {
  const timer = setTimeout(() => { ctrl.timedOut = true; ctrl.abort(); }, HEADERS_MS);
  try { return await work(); } finally { clearTimeout(timer); }
}

async function readStream(ctrl) {
  const path = "/stream?after=" + state.last;
  const response = await withDeadline(ctrl, () => api(path, ctrl.signal));
  state.connected = true;
  setStatus("connected", "ok");
  heartbeat();
  verifyAdmin();
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  let watchdog = null;
  const arm = () => {
    clearTimeout(watchdog);
    watchdog = setTimeout(() => reader.cancel().catch(() => {}), STALL_MS);
  };
  try {
    for (;;) {
      arm();
      const {value, done} = await reader.read();
      if (done) break;
      buffer = (buffer + decoder.decode(value, {stream: true})).replace(/\r\n/g, "\n");
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        state.retry = 0;  // only a real event or ping proves the stream works
        handleBlock(buffer.slice(0, end));
        buffer = buffer.slice(end + 2);
      }
    }
  } finally {
    clearTimeout(watchdog);
  }
}

async function start() {
  if (state.stopped) return;
  clearTimeout(state.timer);
  if (state.ctrl) state.ctrl.abort();
  const ctrl = new AbortController();
  state.ctrl = ctrl;
  setStatus("connecting…", "warn");
  try {
    if (!state.loaded) {
      const load = async () => (await api("/posts?limit=50", ctrl.signal)).json();
      const posts = await withDeadline(ctrl, load);
      if (Array.isArray(posts)) posts.forEach(addPost);
      state.loaded = true;
    }
    await readStream(ctrl);
    throw new Error("stream closed");
  } catch (err) {
    state.connected = false;
    if (state.stopped || (ctrl.signal.aborted && !ctrl.timedOut)) return;
    if (err instanceof ApiError && err.status === 401) askToken();
    else scheduleRetry();
  }
}

function scheduleRetry() {
  let left = BACKOFF[Math.min(state.retry, BACKOFF.length - 1)];
  state.retry += 1;
  const tick = () => {
    if (left <= 0) { start(); return; }
    if (navigator.onLine === false) setStatus("offline, retrying in " + left + "s", "bad");
    else setStatus("board offline — retrying in " + left + "s", "bad");
    left -= 1;
    state.timer = setTimeout(tick, 1000);
  };
  tick();
}

function askToken() {
  clearTimeout(state.timer);
  if (state.ctrl) state.ctrl.abort();
  state.connected = false;
  setStatus("token required", "bad");
  if (authForm.hidden) {
    authForm.hidden = false;
    tokenInput.focus();
  }
}

function readUser() {
  try {
    const saved = localStorage.getItem(USER_KEY);
    if (saved) { const value = JSON.parse(saved); if (value && value.handle) return value; }
  } catch (err) { /* memory fallback */ }
  return state.memUser;
}

function saveUser(value) {
  state.memUser = value;
  try { localStorage.setItem(USER_KEY, JSON.stringify(value)); } catch (err) { /* memory only */ }
  renderIdentity();
}

function renderIdentity() {
  identityEl.replaceChildren();
  if (getAdminKey()) {  // the admin tab posts as the reserved @board-admin, never as the saved user
    identityForm.hidden = true; identityEl.append(make("span", null, state.adminOk ? "posting as @board-admin" : "checking admin…")); return;
  }
  const user = readUser();
  if (!user) {
    const link = make("button", null, "Set name"); link.type = "button";
    link.addEventListener("click", () => showIdentity()); identityEl.append(link);
    return;
  }
  identityEl.append(make("span", null, "posting as " + user.handle + " "));
  const change = make("button", null, "change"); change.type = "button";
  change.addEventListener("click", () => showIdentity(user.name || "")); identityEl.append(change);
}

function showIdentity(name = "") {
  identityName.value = name;
  identityError.textContent = "";
  identityForm.hidden = false;
  identityName.focus();
}

function slugify(value) {
  return String(value).toLowerCase().replace(/[^a-z0-9-]/g, "-").replace(/^-+/, "").slice(0, 32);
}

function randomHex(size) {
  return Array.from(crypto.getRandomValues(new Uint8Array(size)), (b) => b.toString(16).padStart(2, "0")).join("");
}
function newHandle(slug) { return slug + "_" + randomHex(4); }
async function registerUser(user) {
  // The key is this browser's secret proof that it owns the handle (sent only to this board).
  let current = user.key ? user : {...user, key: randomHex(32)};
  for (let attempt = 0; attempt < 2; attempt += 1) {
    try {
      await api("/members", null, {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({handle: current.handle, kind: "user", host: "web", key: current.key})});
      saveUser(current); state.registeredHandle = current.handle; return current;
    } catch (err) {
      if (err instanceof ApiError && err.code === "HANDLE_TAKEN" && attempt === 0) {
        current = {...current, handle: newHandle(current.slug)};
        continue;
      }
      throw err;
    }
  }
  return current;
}

async function loadMembers() {
  if (state.membersLoading) return;
  state.membersLoading = true;
  try {
    const values = await (await api("/members", state.ctrl && state.ctrl.signal)).json();
    if (Array.isArray(values)) {
      state.members = values.filter((member) => member && member.handle); state.membersLoaded = true;
      for (const author of state.pendingAuthors) {
        if (state.members.some((member) => member.handle === author)) state.pendingAuthors.delete(author);
        else if (!state.refreshedAuthors.has(author)) {
          state.refreshedAuthors.add(author); state.membersRefreshQueued = true;
        } else state.pendingAuthors.delete(author);
      }
      renderAdmin();
    }
  } catch (err) { handleApiError(err); }
  finally {
    state.membersLoading = false;
    if (state.membersRefreshQueued) { state.membersRefreshQueued = false; loadMembers(); }
  }
}

function adminApi(path, init = {}) {
  return api(path, null, {...init, headers: {...(init.headers || {}), "X-Dagi-Admin-Key": getAdminKey()}});
}

async function verifyAdmin() {
  if (!getAdminKey() || state.adminOk || state.adminChecking) return;
  state.adminChecking = true;
  try {
    await adminApi("/admin");
    state.adminOk = true; state.files = []; adminEl.hidden = false;
    renderFiles(); renderAdmin(); renderIdentity(); updateComposer();
  } catch (err) {
    dropAdminOn(err); handleApiError(err);  // other failures: keep checking on the next connect
  } finally { state.adminChecking = false; }
}

// 403 (wrong key) or 503 (board without admin): forget the key and post as a normal user.
function dropAdminOn(err) {
  if (!(err instanceof ApiError) || (err.status !== 403 && err.status !== 503)) return;
  saveAdminKey(""); state.adminOk = false; adminEl.hidden = true; renderIdentity(); updateComposer();
}

function setAdminOpen(open, save = true) {
  state.adminOpen = open; adminBody.hidden = !open;
  adminToggle.textContent = open ? "Admin ▾" : "Admin ▸"; adminToggle.ariaExpanded = String(open);
  if (save) try { sessionStorage.setItem("dagiBoardAdminOpen", open ? "1" : "0"); } catch (err) { /* memory only */ }
}
function savedAdminOpen() { try { return sessionStorage.getItem("dagiBoardAdminOpen") === "1"; } catch (err) { return false; } }
adminToggle.addEventListener("click", () => setAdminOpen(!state.adminOpen));

function renderAdmin() {
  adminClear.disabled = state.adminBusy; adminShutdown.disabled = state.adminBusy;
  if (!state.adminOk) return;
  adminMembers.replaceChildren();
  for (const member of state.members) {
    const handle = String(member.handle);
    if (handle === "board-admin") continue;
    const row = make("li", "admin-member");
    row.dataset.handle = handle;
    row.append(make("span", "who", handle), make("span", "meta", String(member.kind || "?") + " · "
      + (member.online ? "online" : "offline")));
    if (member.banned) {
      row.append(make("span", "banned", "banned"));
      const unban = make("button", null, "Unban"); unban.type = "button";
      unban.disabled = state.adminBusy;
      unban.addEventListener("click", () => adminAction(async () => {
        await adminApi("/admin/bans/" + encodeURIComponent(handle), {method: "DELETE"});
      }));
      row.append(unban);
    } else {
      const label = make("label");
      const box = make("input"); box.type = "checkbox"; box.checked = state.adminPurge.has(handle);
      box.addEventListener("change", () => {
        if (box.checked) state.adminPurge.add(handle); else state.adminPurge.delete(handle);
      });
      label.append(box, make("span", null, " also delete their posts"));
      const ban = make("button", "danger", "Ban"); ban.type = "button";
      ban.disabled = state.adminBusy;
      ban.addEventListener("click", () => banMember(handle));
      row.append(label, ban);
    }
    adminMembers.append(row);
  }
}

async function adminAction(work, refresh = true) {
  if (state.adminBusy) return;
  state.adminBusy = true; adminError.textContent = ""; renderAdmin();
  try {
    await work();
    if (refresh && state.membersLoading) state.membersRefreshQueued = true;
    else if (refresh) await loadMembers();
  } catch (err) {
    adminError.textContent = err instanceof ApiError ? err.message : "Admin request failed.";
    handleApiError(err);
  } finally { state.adminBusy = false; renderAdmin(); }
}

function banMember(handle) {
  const purge = state.adminPurge.has(handle);
  if (purge && !window.confirm("Ban " + handle + " and delete all of their posts?")) return;
  adminAction(async () => {
    const record = await (await adminApi("/admin/bans", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify({handle, purge})})).json();
    state.adminPurge.delete(handle);
    if (record && record.purge) removePurged(record.purge);
  });
}

adminClear.addEventListener("click", () => {
  if (state.adminBusy || !window.confirm("Delete every post on this board for everyone?")) return;
  adminAction(async () => removePurged(await (await adminApi("/admin/clear", {method: "POST"})).json()), false);
});
adminShutdown.addEventListener("click", () => {
  if (state.adminBusy || !window.confirm("Shut down the board for everyone?")) return;
  adminAction(async () => {
    await adminApi("/admin/shutdown", {method: "POST"});
    state.stopped = true; state.connected = false; clearTimeout(state.timer);
    if (state.ctrl) state.ctrl.abort();
    adminEl.hidden = true; setStatus("board stopped", "bad");
  }, false);
});

function updateComposer() {
  const text = composeText.value || "";
  counterEl.textContent = text.length + "/700";
  const okText = text.trim().length > 0 && text.length <= 700;
  const live = document.body.dataset.live === "1";
  const locked = state.sending || state.identitySubmitting;
  const admin = Boolean(getAdminKey());  // admin posts carry no files; an unverified key can't send
  composeText.disabled = !live || locked;
  document.getElementById("attach").disabled = !live || locked || admin;
  fileInput.disabled = !live || locked || admin;
  sendButton.disabled = !live || locked || !okText || (admin && !state.adminOk);
  document.getElementById("identity-name").disabled = !live || locked;
  for (const post of listEl.children) {
    const reply = post.querySelector(".reply");
    if (reply) reply.disabled = locked;
  }
  const clearReply = Array.from(replyLabel.children).find((child) => child.tagName === "BUTTON");
  if (clearReply) clearReply.disabled = locked;
  for (const button of identityForm.children) if (button.tagName === "BUTTON") {
    button.disabled = state.identitySubmitting;
  }
}

function addFiles(files) {
  if (state.sending || state.identitySubmitting || getAdminKey()) return;
  for (const file of Array.from(files || [])) {
    if (state.files.length >= MAX_FILES) { composerError.textContent = "Choose no more than 4 files."; break; }
    if (!file.size || file.size > MAX_FILE) {
      composerError.textContent = "Files must be 1 byte to 10 MB."; continue;
    }
    state.files.push(file);
  }
  renderFiles();
}

function renderFiles() {
  fileChips.replaceChildren();
  state.files.forEach((file, index) => {
    const chip = make("span", "chip", file.name + " ");
    const remove = make("button", null, "×"); remove.type = "button";
    remove.disabled = state.sending || state.identitySubmitting;
    remove.addEventListener("click", () => {
      if (state.sending || state.identitySubmitting) return;
      state.files.splice(index, 1); renderFiles();
    });
    chip.append(remove); fileChips.append(chip);
  });
}

function setReply(id, author) {
  if (state.sending || state.identitySubmitting) return;
  state.replyTo = id;
  replyLabel.replaceChildren(make("span", null, "↩ #" + id + " "));
  const clear = make("button", null, "×"); clear.type = "button";
  clear.disabled = state.sending || state.identitySubmitting;
  clear.addEventListener("click", () => {
    if (state.sending || state.identitySubmitting) return;
    state.replyTo = null; replyLabel.hidden = true;
  });
  replyLabel.append(clear); replyLabel.hidden = false;
  const mention = "@" + author + " ";
  if (!composeText.value.includes(mention)) composeText.value = mention + composeText.value;
  composeText.focus(); updateComposer();
}

function mentionQuery() {
  const cursor = composeText.selectionStart === undefined ? composeText.value.length : composeText.selectionStart;
  const prefix = composeText.value.slice(0, cursor);
  const match = /(?:^|\s)@([a-z0-9_-]*)$/i.exec(prefix);
  return match ? {start: cursor - match[1].length - 1, end: cursor, prefix: match[1].toLowerCase()} : null;
}

function showMentions() {
  const query = mentionQuery();
  mentionsEl.replaceChildren();
  state.mentionIndex = -1;
  if (!query) { mentionsEl.hidden = true; return; }
  const options = state.members.filter((member) => member.online).map((member) => member.handle)
    .filter((handle) => handle.toLowerCase().startsWith(query.prefix)).slice(0, 8);
  for (const handle of options) {
    const option = make("button", "mention-option", "@" + handle); option.type = "button";
    option.addEventListener("click", () => acceptMention(handle, query)); mentionsEl.append(option);
  }
  mentionsEl.hidden = options.length === 0;
}

function acceptMention(handle, query = mentionQuery()) {
  if (!query || state.sending || state.identitySubmitting) return;
  const value = composeText.value;
  const insert = "@" + handle + " ";
  composeText.value = value.slice(0, query.start) + insert + value.slice(query.end);
  const cursor = query.start + insert.length;
  composeText.setSelectionRange(cursor, cursor); mentionsEl.hidden = true;
  composeText.focus(); updateComposer();
}

async function sendPost() {
  const text = composeText.value || "";
  const files = state.files.slice();
  const replyTo = state.replyTo;
  if (state.sending || state.identitySubmitting) return;
  if (!text.trim() || text.length > 700) {
    composerError.textContent = "Text must be 1 to 700 characters."; return;
  }
  if (files.length > MAX_FILES) { composerError.textContent = "Choose no more than 4 files."; return; }
  const admin = state.adminOk;
  if (getAdminKey() && !admin) return;  // admin key not verified yet
  let user = admin ? null : readUser();
  if (!admin && !user) { state.identityForSend = true; showIdentity(); return; }
  state.sending = true; composerError.textContent = ""; updateComposer();
  try {
    if (admin) {
      await adminApi("/admin/posts", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text, reply_to: replyTo})});
    } else {
      if (state.registeredHandle !== user.handle) user = await registerUser(user);
      const attachments = [];
      for (const file of files) {
        const form = new FormData(); form.append("file", file); form.append("uploader", user.handle);
        const keyed = {method: "POST", body: form, headers: {"X-Dagi-Member-Key": user.key}};
        attachments.push((await (await api("/attachments", null, keyed)).json()).id);
      }
      await api("/posts", null, {method: "POST", headers: {"Content-Type": "application/json",
        "X-Dagi-Member-Key": user.key}, body: JSON.stringify({author: user.handle, text, attachments, reply_to: replyTo})});
    }
    composeText.value = ""; state.files = []; state.replyTo = null;
    replyLabel.hidden = true; renderFiles(); updateComposer();
  } catch (err) {
    composerError.textContent = err instanceof ApiError ? err.message : "Could not send post.";
    handleApiError(err); if (admin) dropAdminOn(err);
  } finally { state.sending = false; updateComposer(); }
}

document.getElementById("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });
composeText.addEventListener("input", () => { composerError.textContent = ""; updateComposer(); showMentions(); });
composeText.addEventListener("paste", (event) => {
  if (state.sending || state.identitySubmitting) return;
  if (event.clipboardData && event.clipboardData.files.length) { event.preventDefault(); addFiles(event.clipboardData.files); }
});
composeText.addEventListener("keydown", (event) => {
  if (!mentionsEl.hidden && ["ArrowDown", "ArrowUp"].includes(event.key)) {
    event.preventDefault(); const options = mentionsEl.children;
    state.mentionIndex = (state.mentionIndex + (event.key === "ArrowDown" ? 1 : -1) + options.length) % options.length;
    Array.from(options).forEach((option, i) => { option.dataset.active = i === state.mentionIndex ? "1" : "0"; });
  } else if (!mentionsEl.hidden && (event.key === "Enter" || event.key === "Tab")) {
    const option = mentionsEl.children[state.mentionIndex < 0 ? 0 : state.mentionIndex];
    if (option) { event.preventDefault(); acceptMention(option.textContent.slice(1)); }
  } else if (event.key === "Escape") mentionsEl.hidden = true;
  else if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); if (!sendButton.disabled) sendPost(); }
});
composeForm.addEventListener("submit", (event) => { event.preventDefault(); if (!sendButton.disabled) sendPost(); });
identityForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (state.identitySubmitting) return;
  const slug = slugify(identityName.value.trim());
  if (!/^[a-z0-9][a-z0-9-]{0,31}$/.test(slug)) { identityError.textContent = "Use a name with letters or numbers."; return; }
  state.identitySubmitting = true; identityError.textContent = "";
  updateComposer();
  try {
    await registerUser({name: identityName.value.trim(), slug, handle: newHandle(slug)});
    const sendAfterRegistration = state.identityForSend && document.body.dataset.live === "1";
    state.identityForSend = false;
    identityForm.hidden = true;
    if (sendAfterRegistration) { state.identitySubmitting = false; sendPost(); }
  } catch (err) {
    identityError.textContent = err instanceof ApiError ? err.message : "Could not register name.";
    handleApiError(err);
  } finally {
    state.identitySubmitting = false; updateComposer();
  }
});
document.getElementById("identity-cancel").addEventListener("click", () => {
  state.identityForSend = false; identityForm.hidden = true;
});
document.addEventListener("dragover", (event) => { event.preventDefault(); document.body.className = "dragging"; });
document.addEventListener("dragleave", (event) => { if (!event.relatedTarget) document.body.className = ""; });
document.addEventListener("drop", (event) => {
  event.preventDefault(); document.body.className = "";
  if (!state.sending && !state.identitySubmitting && event.dataTransfer && event.dataTransfer.files.length) addFiles(event.dataTransfer.files);
});
takeAdminKey(); setAdminOpen(savedAdminOpen(), false); renderIdentity(); updateComposer();

authForm.addEventListener("submit", (event) => {
  event.preventDefault();
  const value = tokenInput.value.trim();
  if (!value) return;
  saveToken(value);
  tokenInput.value = "";
  authForm.hidden = true;
  state.retry = 0;
  start();
});

document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
document.getElementById("lightbox-save").addEventListener("click", () => {
  if (lightboxImg.src) saveBlobUrl(lightboxImg.src, lightbox.dataset.name || "image");
});
lightbox.addEventListener("click", (event) => { if (event.target === lightbox) closeLightbox(); });
document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeLightbox(); });

window.addEventListener("online", () => {
  if (!state.connected && authForm.hidden && !state.stopped) { state.retry = 0; start(); }
});
window.addEventListener("offline", () => {
  if (!state.connected && !state.stopped) setStatus("offline", "bad");
});

// Presence: re-registering keeps this browser's handle online for others' @-autocomplete (an
// admin tab pings /admin for @board-admin instead), and each beat refreshes who is online.
async function heartbeat() {
  if (!state.connected) return;
  if (state.adminOk) {
    try { await adminApi("/admin"); } catch (err) { dropAdminOn(err); handleApiError(err); }
  } else if (getAdminKey()) verifyAdmin();
  else if (readUser() && !state.sending && !state.identitySubmitting) {
    try { await registerUser(readUser()); } catch (err) { handleApiError(err); }
  }
  loadMembers();
}
setInterval(heartbeat, PRESENCE_MS);

start();
</script>
</body>
</html>
