# ── Per-project configuration ────────────────────────────────────────────────
# Place a .dagi/config.yaml in any project directory to override settings here.
#
# Merge behaviour:
#   - models: block is shallow-merged — project entries add to or fully replace
#     root entries (the whole entry wins; individual fields are NOT deep-merged).
#   - All other top-level fields (max_continuations, tools, etc.) are scalars:
#     the project value wins when the key is present.
#   - default_model: project value takes precedence if set.
#
# Example project .dagi/config.yaml:
#
#   default_model: fast-local
#   max_continuations: 5
#   tools:
#     - read
#     - write
#     - bash
#   models:
#     fast-local:
#       name: "Local Ollama"
#       model: "llama3.2"
#       api_url: "http://localhost:11434/v1"
#       api_key: "ollama"
#
# ─────────────────────────────────────────────────────────────────────────────
# dagi — configuration example
# Copy this file to config.yaml and fill in your values.
# ─────────────────────────────────────────────────────────────────────────────

# ── CLI settings ─────────────────────────────────────────────────────────────
cli:
  threading: threaded   # "threaded" = non-blocking REPL (agent runs in background thread)
                        # "sync"     = blocks the REPL until the task finishes
  verbose: false        # true = display full tool call input/output in the CLI

# ── Context window & compaction ──────────────────────────────────────────────
# Controls when and how dagi compacts its message history to stay within the
# model's token limit (Pi-style: summarise the middle, preserve head + tail).
# All three values can also be overridden per-model in the catalog below.

context_window: 128000      # Model's hard token limit (prompt + response combined).
                             # Set this to the actual context length of your model.
reserve_tokens: 16384        # Tokens held back for the assistant's next reply and the
                             # compaction summary itself. Compaction fires when
                             # prompt_tokens > context_window - reserve_tokens.
                             # Also used as the output-filter threshold: tool results
                             # >= reserve_tokens tokens are truncated to reserve_tokens/2
                             # tokens in context; full output is saved to .dagi/temp/.
keep_recent_tokens: 20000    # Minimum number of recent message tokens preserved verbatim
                             # (tail of the conversation) during compaction.

# ── Loop behaviour ────────────────────────────────────────────────────────────
max_continuations: 10   # Maximum number of times the harness auto-injects "continue"
                        # before giving up and returning the last response. A higher
                        # value allows longer uninterrupted tool chains; a lower value
                        # surfaces stalled tasks sooner. Resets per run() call.

null_response_retries: 3  # How many times to silently retry an API call that returns
                          # an empty/null response (HTTP 200 but content=None, usage=None).
                          # Increase for flaky providers (e.g. 5). Each retry replays the
                          # same context — the ghost response is never appended to history.

# ── Model selection ───────────────────────────────────────────────────────────
# All values must match a key defined under the `models:` catalog below.

default_model: gpt-4o-openai        # Primary model used for all regular tasks.

# worker_model: gpt-4o-mini-openai  # Optional: cheaper/faster model for sub-agents
                                    # (spawned by the plan-work-review workflow).
                                    # Omit to use default_model for sub-agents.

# advanced_model: gpt-4o-openai     # Optional: higher-capability model activated
                                    # automatically when the agent enters plan mode.
                                    # Omit to use default_model during planning.

# ── Reasoning / thinking ──────────────────────────────────────────────────────
# Streaming: render assistant text/reasoning incrementally in the TUI as it
# is generated. true (default) = stream; false = wait for the full response.
# Can also be set per-model inside a models: entry to override the global value.
stream: true

thinking: none    # Extended reasoning effort for models that support it (e.g. DeepSeek,
                  # Claude 3+ Opus via OpenRouter's `reasoning` extension).
                  # Values: none | low | medium | high
                  # Can be overridden per-model in the catalog below.

# ── Memory ────────────────────────────────────────────────────────────────────
# Absolute path to the dagi-memory directory containing wiki/, raw/, and sources/
# sub-directories used for persistent knowledge retrieval (BM25).
# Omit to use the default: {current working directory}/dagi-memory
# memory_root: /absolute/path/to/dagi-memory

# ── Affect ────────────────────────────────────────────────────────────────────
# affect:
#   drift_pull: 0.05        # Pull each VAD axis back toward baseline on drift
#   drift_noise: 0.02       # Random drift noise per axis; must be between 0 and 1
#   emote_hysteresis: 0.05  # Stickiness when choosing the nearest VAD emote
#   wander_volatility: 0.08 # Brownian motion step size for baseline wandering
#   drift_interval: 1.0     # Seconds between VAD value refresh

# ── Tools ─────────────────────────────────────────────────────────────────────
sandbox_mode: false  # true  = file tools (read, write, edit, grep, find, copy) have no
                     #         path restrictions — the agent can access any path on disk.
                     # false = file tools are restricted to allowed_roots
                     #         ([dagi_root, cwd] by default). Recommended for most use cases.

# tools:                      # Restrict the main agent to a specific subset of tools.
#                             # Omit (or set to null) to enable all available tools.
#   # ── File tools ──────────────────────────────────────────────────────────────
#   - read                    # Read files from disk
#   - grep                    # Regex search across files
#   - find                    # Locate files by name/pattern
#   - write                   # Write (create/overwrite) files
#   - edit                    # Patch a specific region of a file
#   - copy                    # Copy files or directories
#   # ── Shell tools ─────────────────────────────────────────────────────────────
#   - bash                    # Run arbitrary shell commands
#   # ── Git tools ────────────────────────────────────────────────────────────────
#   - git_status              # Show current git status / diff
#   - git_commit              # Stage and commit changes
#   - git_rollback            # Revert uncommitted changes
#   # ── Planning tools ───────────────────────────────────────────────────────────
#   - enter_plan_mode         # Switch agent into plan-writing mode
#   - complete_plan           # Mark a plan step as done and continue
#   # ── Agent / subagent tools ───────────────────────────────────────────────────
#   - ask_user                # Pause and prompt the user for input
#   - extend_subagent_timeout # Extend timeout for an in-flight subagent
#   # ── Model tools ──────────────────────────────────────────────────────────────
#   - switch_model            # Switch between default / worker / advanced models
#   # ── Skill tools ──────────────────────────────────────────────────────────────
#   - skill                   # Load and run a skill document
#   - run_skill_script        # Execute a skill's companion script
#   - reload_skills           # Hot-reload skill definitions from disk
#   # ── Web tools ────────────────────────────────────────────────────────────────
#   - web_search              # Search the web (fallback when no config subagents)
#   - web_fetch               # Fetch a URL (fallback when no config subagents)
#   # ── Affect tools ─────────────────────────────────────────────────────────────
#   - emote                    # Express emotion via VAD adjustment and/or meme display

# ── Model catalog ─────────────────────────────────────────────────────────────
# Define every model you want available to dagi here.
# The map key (e.g. "gpt-4o-openai") is the model ID referenced by default_model,
# worker_model, and advanced_model above, and by the /model slash command.
#
# Required fields per entry:
#   name        Human-readable label shown in the TUI sidebar and session logs.
#   model       Model identifier string sent verbatim to the provider API.
#   api_url     Provider API base URL (must be an OpenAI-compatible endpoint).
#   api_key_env Name of the environment variable holding the API key.
#               Recommended approach — keeps secrets out of this file.
#
# Optional fields per entry:
#   api_key           Inline API key (overrides api_key_env). Avoid committing
#                     this file if api_key is set here.
#   context_window    Per-model override for the token budget (overrides top-level).
#   reserve_tokens    Per-model override for the compaction reserve (overrides top-level).
#   keep_recent_tokens  Per-model override for the compaction tail (overrides top-level).
#   thinking          Per-model override for the reasoning effort (overrides top-level).
#   provider_order    OpenRouter only: ordered list of provider slugs to try in sequence.
#                     e.g. ["Anthropic", "Together"] — routes to Anthropic first, falls back
#                     to Together if unavailable. Omit to use OpenRouter's default load balancing.
#                     Full slug list: https://openrouter.ai/docs/guides/routing/provider-selection

models:
  gpt-4o-openai:
    api_key_env: OPENAI_API_KEY
    api_url: https://api.openai.com/v1
    model: gpt-4o
    name: GPT-4o (OpenAI)

  gpt-4o-mini-openai:
    api_key_env: OPENAI_API_KEY
    api_url: https://api.openai.com/v1
    model: gpt-4o-mini
    name: GPT-4o Mini (OpenAI)

  claude-sonnet-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: anthropic/claude-sonnet-4-6
    name: Claude Sonnet 4.6 (OpenRouter)
    # provider_order:         # Optional: pin to specific provider(s) in priority order.
    #   - Anthropic           # Try Anthropic's direct endpoint first.
    #   - Together            # Fall back to Together if Anthropic is unavailable.

  claude-opus-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: anthropic/claude-opus-4-6
    name: Claude Opus 4.6 (OpenRouter)

  deepseek-v4-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-pro
    name: DeepSeek v4 Pro (OpenRouter)
    thinking: high    # Example of a per-model thinking override

  # ── Free-tier models (OpenRouter) ──────────────────────────────────────
  hy3-free-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: tencent/hy3:free
    name: Hunyuan 3 Free (OpenRouter)

  nemotron-ultra-free-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: nvidia/nemotron-3-ultra-550b-a55b:free
    name: Nemotron Ultra Free (OpenRouter)

  # ── Local model example (LM Studio, Ollama, llama.cpp, etc.) ──────────────
  # local_model:
  #   api_key_env: OPENAI_API_KEY   # Most local servers ignore this; set to any non-empty value
  #   api_url: http://localhost:11434/v1
  #   model: llama3.2
  #   name: Llama 3.2 (Local)
  #   context_window: 8192           # Example per-model context override for a smaller model
  #   reserve_tokens: 2048
  #   keep_recent_tokens: 4096

  # ── Large-context model example ────────────────────────────────────────────
  # gemini-pro-openrouter:
  #   api_key_env: OPENROUTER_API_KEY
  #   api_url: https://openrouter.ai/api/v1
  #   model: google/gemini-2.5-pro
  #   name: Gemini 2.5 Pro (OpenRouter)
  #   context_window: 1000000        # This model supports 1M tokens
  #   reserve_tokens: 32768
  #   keep_recent_tokens: 50000

# ── Services ──────────────────────────────────────────────────────────────────
# URLs for standalone dagi microservices. Omit a service to use its built-in default.
services:
  doc_converter: "http://localhost:8100"  # Document converter service URL (start with: python -m services.doc_converter)

# ── Telegram bot ──────────────────────────────────────────────────────────────
# Configure the Telegram bot interface (telegram_bot.py entry point).
# Set the bot token in your .env file, NOT here.
#
# telegram:
#   bot_token_env: TELEGRAM_BOT_TOKEN  # env var holding your bot token (from @BotFather)
#   allowed_chat_ids_env: TELEGRAM_ALLOWED_CHAT_IDS  # env var: comma-separated chat IDs allowed to use the bot
#
# Set TELEGRAM_ALLOWED_CHAT_IDS in your .env (e.g. "123456789,987654321").
# WARNING: if left unset, the bot accepts commands (including shell access) from
# anyone who finds it on Telegram — a startup warning is logged when this happens.
