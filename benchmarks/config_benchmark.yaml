# config_benchmark.yaml — Harbor / Terminal-bench benchmark configuration
# Copy your model definitions from config.yaml and tune settings for benchmarks.
# This file is loaded by benchmarks/harbor/agent.py and benchmarks/terminal_bench/agent.py.
#
# Select model at run time (default is local-llamacpp):
#   benchmarks\run_harbor.bat
#   set DAGI_BENCH_MODEL=claude-sonnet-openrouter && benchmarks\run_harbor.bat
# ── Context  ────────────────────────────────────────────────────────────
# Per-model overrides below take precedence; these are fallback defaults.
context_window: 32000
reserve_tokens: 4096
keep_recent_tokens: 8000
max_iterations: 20

# ── Loop behaviour ────────────────────────────────────────────────────────────
max_continuations: 30
null_response_retries: 5
api_error_retries: 5

# ── Harbor environment preamble ───────────────────────────────────────────────
# Injected at the TOP of the system prompt for every Harbor benchmark run.
system_prompt_preamble: |
  ## Harbor Benchmark Environment

  You are running inside a **Harbor benchmark**. The task's files live in a
  **Docker container** — they are NOT on the local filesystem.

  CRITICAL rules:
  - Your **FIRST action** must be `harbor_bash("ls /app")` to explore the container.
  - ALL file access (read, write, compile, run, test) MUST go through `harbor_bash`.
  - The local `find` / `read` / `grep` / `write` / `edit` tools see only the
    Windows host — they cannot reach container paths like `/app`. Do not use them
    for task-related files.
  - Do NOT call `enter_plan_mode`. Plan mentally, then act immediately via
    `harbor_bash`. Time-boxed benchmarks have no human to approve a plan.
  - The task workspace is typically `/app` in the container. Start there.

# ── Tools ─────────────────────────────────────────────────────────────────────
# Only harbor_bash is exposed — local filesystem tools (read/find/grep/write/edit)
# see the Windows host, NOT the Docker container, so they are harmful here.
# ask_user would block indefinitely with no human present in an automated run.
tools:
  - harbor_bash

# bash_backend: no-op kept for backwards compatibility
bash_backend: subprocess

# ── Model catalog ─────────────────────────────────────────────────────────────
# default_model: local-llamacpp
default_model: deepseek-v4-flash-openrouter

models:
  local-llamacpp:
    name: Qwen3 35B (llama.cpp, port 8080)
    model: Qwen3-35B                               # llama.cpp ignores this; serves whatever is loaded
    api_url: http://localhost:8080/v1
    api_key: local                                 # any non-empty value; llama-server doesn't validate
    context_window: 32000                          # matches --ctx-size 32000 (or lower)
    reserve_tokens: 4096                           # held back for reply + compaction summary
    keep_recent_tokens: 8000                       # tail preserved verbatim; fires at ~27900 tokens

  deepseek-v4-flash-openrouter:
    api_key_env: OPENROUTER_API_KEY
    api_url: https://openrouter.ai/api/v1
    model: deepseek/deepseek-v4-flash
    name: Deepseek v4 Flash(OpenRouter)