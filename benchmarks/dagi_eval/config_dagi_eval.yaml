# Benchmark config for the dagi eval harness (benchmarks/dagi_eval/run.py).
# Same schema as config.yaml; passed to resolve_model_config(config_path=...).
default_model: hy3-free-openrouter
# default_model: nemotron-ultra-free-openrouter
# No worker_model/advanced_model yet — there is only one tier for now.
# switch_model is still exposed (see harness.py, which points worker_config/
# advanced_config back at the resolved default config after loading) so dagi
# can call it; switching tiers is currently a same-model no-op.
max_continuations: 30
cache_prompt: true

# Only these tools are registered for benchmark runs. No ask_user (runs are
# unattended — the on_ask_user callback auto-answers anyway), no web_search/
# web_fetch (the tasks are self-contained). Plan mode and skills are enabled:
# dagi may call enter_plan_mode/complete_plan, and skill/run_skill_script to
# load SKILL.md docs from <repo_root>/.dagi/skills/ (there's no per-task
# skills dir, so only the repo's builtin skills are visible). Subagents and
# switch_model are enabled so dagi can delegate sub-tasks and manage its own
# context budget. "compact" is intentionally NOT listed here: CompactTool is
# bound directly by AgentLoop (agent/loop.py) and is never added to the
# ToolRegistry, so it can never be an LLM-callable tool regardless of this
# list — listing it here was a dead no-op.
tools:
  - read
  - write
  - edit
  - bash
  - grep
  - find
  - enter_plan_mode
  - complete_plan
  - skill
  - run_skill_script
  - switch_model
  - read_large_text
  - explore_files
  - memory_add
  - memory_query
  - review_work
  - web_research
  - run_worker
  - run_cli
  - extend_subagent_timeout

system_prompt_preamble: |
  ## Benchmark Environment
  You are being evaluated in an unattended benchmark run. The task specification
  is in spec.md in your working directory — read it first. Work fully
  autonomously: never ask the user questions and never wait for confirmation.
  Your working directory contains everything you need; produce the required
  artifacts there. Python packages available: numpy, pandas, scipy, scikit-learn.
  Run python via: conda run -n dagi python <script>

  If you use plan mode, call enter_plan_mode with mode="autonomous" — there is
  no user available to review or approve the plan, so interactive mode will
  stall waiting for input that will never usefully arrive.

  ## Environment Detection
  Your first bash command should detect the OS. On Windows, use `cmd` builtins
  (dir, type, where, echo) — NOT Unix commands (ls, cat, find, head, tail).
  On Linux/macOS, Unix commands are fine. A quick check: run `echo %OS%` or
  `uname -s` and adapt all subsequent shell commands accordingly.

  ## Signaling Completion
  When you have finished the task and produced all required artifacts, output a
  final assistant message containing the exact marker <<END_OF_RESPONSE>> so
  the harness knows you are done. Do not continue issuing tool calls after
  this point. Omitting this marker wastes iterations on auto-injected
  "continue" prompts.

models:
  claude-sonnet-openrouter:
    name: "Claude Sonnet (OpenRouter)"
    model: "anthropic/claude-sonnet-4-6"
    api_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  deepseek-openrouter:
    name: "DeepSeek (OpenRouter)"
    model: "deepseek/deepseek-chat"
    api_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  hy3-free-openrouter:
    name: "Hunyuan 3 Free (OpenRouter)"
    model: "tencent/hy3:free"
    api_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  nemotron-ultra-free-openrouter:
    name: "Nemotron Ultra Free (OpenRouter)"
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
    api_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
