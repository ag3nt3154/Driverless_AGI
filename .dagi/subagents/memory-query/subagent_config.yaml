model_tier: default
description: >-
  Query the memory wiki by traversing its index structure and grepping for
  relevant content. Returns a synthesised answer with citations.
root: memory_root
tools:
  - read
  - grep
  - find
  - write
  - edit
  - bash
parameters:
  type: object
  properties:
    task:
      type: string
      description: >-
        The question or topic to look up in the memory wiki.
        Be specific — include key terms, concepts, or entity names.
    briefing:
      type: string
      description: >-
        Additional guidance from the main agent: traps to avoid, prior failed
        attempt context, or extra constraints. Optional.
    handoff_spec:
      type: string
      description: >-
        Free-text description of what the parent wants in the handoff report.
        Optional — falls back to the default handoff spec for this role.
  required:
    - task
default_handoff_spec: >-
  A synthesized answer with citations to the specific wiki pages consulted.
