model_tier: default
description: >-
  Add or update knowledge in the memory wiki. Detects user TODO intent (plans,
  goals, intentions) and appends to wiki/user-todo.md. Routes project-specific
  content to wiki/projects/{name}/ and general knowledge to wiki/knowledge/{topic}/.
root: memory_root
tools:
  - read
  - grep
  - find
  - write
  - edit
  - bash
parameters:
  type: object
  properties:
    task:
      type: string
      description: >-
        Description of the knowledge to save. Prefix with "Project: <name>" for
        project-specific knowledge (e.g. "Project: trading — The risk engine uses
        Kelly criterion for position sizing."). Omit the prefix for general knowledge.
    briefing:
      type: string
      description: >-
        Additional guidance from the main agent: traps to avoid, prior failed
        attempt context, or extra constraints. Optional.
    handoff_spec:
      type: string
      description: >-
        Free-text description of what the parent wants in the handoff report.
        Optional — falls back to the default handoff spec for this role.
  required:
    - task
default_handoff_spec: >-
  Confirmation of what was filed, where (path), and what index files were
  updated.
