[project]
name = "driverless-agi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",       # OpenAI-compatible API client — used for all model providers
    "pyyaml>=6.0",         # config.yaml parsing
    "python-dotenv>=1.2.2", # .env file loading for API keys; floor fixes CVE-2026-28684 (symlink file overwrite)
    "rich>=13.0",          # Rich text rendering in the CLI (markdown, panels, tables)
    "typer<0.25.0",        # CLI framework for tui.py entry point; ceiling required by docling-core (typer<0.25.0)
    "textual>=0.80.0",     # TUI framework for the full-canvas terminal UI (tui.py)
    "langchain>=1.3.4",    # Core LLM orchestration and agent framework
    "langchain-openai>=1.2.2", # OpenAI provider for LangChain
    "psutil>=5.9.0",       # RAM/CPU introspection — used by tests/conftest.py RAM watchdog
    "win11toast>=0.35",    # Native Windows 10/11 toast notifications; degrades to a silent no-op on non-Windows hosts or if missing
    "httpx>=0.27",         # HTTP client used as the fallback web fetcher
    "beautifulsoup4>=4.12", # HTML parser used alongside httpx when crawl4ai is unavailable
]

[project.optional-dependencies]
# Install to run benchmarks/dagi_eval (coding speedup + DS scorecard tasks).
benchmark = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.4"]
# Install to enable the telegram_bot.py entry point.
telegram = ["python-telegram-bot>=21.0"]
# Install to enable the web_search and web_fetch tools' primary (non-fallback) path.
# dagi starts and runs without these; affected tools return a friendly error message.
web = ["ddgs>=2.0", "crawl4ai>=0.8.7"]

[project.scripts]
dagi = "main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
